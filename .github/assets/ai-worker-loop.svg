<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Anas Butt — AI Engineer and founder of Omniveer</title>
  <desc id="desc">An animated pipeline showing an AI worker moving from inquiry through qualification and action to human review.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1324"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="18" fill="url(#surface)"/>
  <rect width="1000" height="220" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="218" rx="17" fill="none" stroke="#94a3b8" stroke-opacity="0.16"/>

  <text x="50" y="48" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">ANAS BUTT / OMNIVEER</text>
  <text x="50" y="82" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="0.4">AI WORKERS FOR REAL BUSINESS WORKFLOWS</text>

  <circle cx="830" cy="42" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="844" y="47" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">HUMAN IN CONTROL</text>

  <path d="M150 150 H850" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M150 150 H850" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 14" opacity="0.45">
    <animate attributeName="stroke-dashoffset" values="38;0" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="150" cy="150" r="20" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.8"/>
      <circle cx="150" cy="150" r="6" fill="#22d3ee"/>
      <text x="150" y="191" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">INQUIRY</text>
    </g>
    <g>
      <circle cx="383" cy="150" r="20" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.8"/>
      <path d="M376 150 l5 5 10-11" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="383" y="191" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">QUALIFY</text>
    </g>
    <g>
      <circle cx="616" cy="150" r="20" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.8"/>
      <path d="M609 157 l14-14 M614 143 h9 v9" fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="616" y="191" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">ACT</text>
    </g>
    <g>
      <circle cx="850" cy="150" r="20" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.9"/>
      <path d="M842 150 l5 5 11-12" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="850" y="191" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">REVIEW</text>
    </g>
  </g>

  <circle r="5" fill="#e0f2fe" filter="url(#glow)">
    <animateMotion path="M150 150 H850" dur="5.2s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5.2s" repeatCount="indefinite"/>
  </circle>
</svg>
